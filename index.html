function playAudio() {
   
   const audio = document.getElementById("audio");
	   if (audio.paused) {

	   } else {
		   audio.pause();
		   
	   }
   $("#ex1").modal("destroy")
   $(".jquery-modal.blocker.current").remove()
   $("body").css("overflow-x","hidden")
   $("body").css("overflow-y","auto")
   isScrolling = true;
   scrollDown()
}

$(document).ready(()=>{
	$(".owl-carousel").owlCarousel({
		loop:true,
		margin:10,
		nav:true,
		autoWidth:true,
		center:true
	});
})

function scrollDown() {
// Obtenemos la posición actual del scroll vertical
const currentPosition = window.pageYOffset;
// Definimos la posición a la que queremos desplazarnos (puedes ajustarla según tus necesidades)
const targetPosition = document.body.scrollHeight;
// Calculamos la distancia que necesitamos recorrer
const distance = targetPosition - currentPosition;
// Duración del desplazamiento (en milisegundos)
const duration = 100000; // 1 segundo

let start = null;



let animationFrame = null;

function step(timestamp) {
	if (!start) start = timestamp;
	const progress = timestamp - start;
	window.scrollTo(0, currentPosition + distance * (progress / duration));
	
	if(isScrolling){
		if (progress < duration) {
			window.requestAnimationFrame(step);
		}
	}else{
		window.cancelAnimationFrame(animationFrame);
	}
	
	
}

window.requestAnimationFrame(step);

}


window.addEventListener('touchstart', function() {

isScrolling = false;
});

document.getElementById('playButton').addEventListener('click', function() {
		const audio = document.getElementById('audio');
		if (audio.paused) {
			audio.play();
			this.textContent = 'Pausar';
		} else {
			audio.pause();
			this.textContent = 'Reproducir';
		}
	});







</script>
